# QuickShulkerForStarCity Configuration

# 是否允许右键空气打开潜影盒
right-click-to-open: true

# 打开/关闭潜影盒时是否播放音效
play-sound: true

# 是否允许通过命令打开
command-open: true

# 权限不足时的消息
no-permission-message: '&c你没有权限使用此功能'

# 重载成功消息
reload-message: '&a配置已重载'

# 不是潜影盒的提示
not-shulker-message: '&c你手中没有潜影盒'

# 客户端Mod高级功能的频道名 (需要与客户端Mod一致)
plugin-message-channel: 'quickshulker:main'
