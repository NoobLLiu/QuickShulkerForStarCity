# QuickShulkerForStarCity Configuration

# 是否允许右键空气打开潜影盒
right-click-to-open: true

# 打开/关闭潜影盒时是否播放音效
play-sound: true

# 是否允许通过命令打开
command-open: true

# 权限不足时的消息
no-permission-message: '&c你没有权限使用此功能'

# 重载成功消息
reload-message: '&a配置已重载'

# 不是潜影盒的提示
not-shulker-message: '&c你手中没有潜影盒'

# ==================== MGActivitys 成长值门槛解锁 ====================
# 需要安装 MGActivitys 插件；未安装时此功能自动禁用，不影响其他功能。
unlock:
  # 是否启用成长值门槛解锁（false 则跳过所有检查）
  enabled: true
  # 累计成长值门槛（MGActivitys 的 totalActivity，不是 Minecraft 经验等级）
  # 20级 = 84200 成长值
  required-growth: 84200.0
  # 解锁模式：
  #   permanent - 首次达标后永久解锁，即使成长值后续下降也不重新锁定
  #   dynamic   - 每次使用功能时实时查询，当前不足即禁止
  mode: permanent
  # 未解锁时发送给玩家的消息（支持 & 颜色代码）
  # %required% = 门槛值，%current% = 玩家当前成长值
  locked-message: '&c需要累计成长值达到 %required%，当前为 %current%。'
